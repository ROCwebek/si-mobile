name: Expo CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-check:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo lint
        run: npm run lint

      - name: Generate Expo Router types
        run: npm exec -- expo customize tsconfig.json

      - name: Check TypeScript
        run: npm exec -- tsc --noEmit

      - name: Export Android, iOS and web bundles
        run: npm exec -- expo export --platform all
